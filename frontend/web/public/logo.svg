<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <!-- Mesh-gradient: stone-700 → sage-500 → dusty teal («припыленная» warm gray). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#44403c" />
      <stop offset="0.5" stop-color="#7a8a7e" />
      <stop offset="1" stop-color="#5e7e7a" />
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#a8a29e" stop-opacity="0.6" />
      <stop offset="1" stop-color="#94a39a" stop-opacity="0.0" />
    </linearGradient>
  </defs>
  <!-- Soft outer ring для глубины. -->
  <circle cx="32" cy="32" r="30" fill="url(#ring)" />
  <!-- Градиентный диск. -->
  <circle cx="32" cy="32" r="26" fill="url(#bg)" />
  <!-- Моноглиф «AC» (AI Career) — белый, medium-weight, отрицательный трекинг. -->
  <text
    x="32"
    y="40"
    font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif"
    font-size="22"
    font-weight="600"
    text-anchor="middle"
    fill="#ffffff"
    letter-spacing="-1.5"
  >AC</text>
</svg>
