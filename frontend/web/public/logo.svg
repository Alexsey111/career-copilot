<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <!-- Палитра: #004D43 (глубокий teal) → #1A3134 (угольный бирюзовый) + #CFFF71 (лайм). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#004D43" />
      <stop offset="0.5" stop-color="#1A3134" />
      <stop offset="1" stop-color="#004D43" />
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#CFFF71" stop-opacity="0.6" />
      <stop offset="1" stop-color="#CFFF71" stop-opacity="0.0" />
    </linearGradient>
  </defs>
  <!-- Soft outer ring для глубины. -->
  <circle cx="32" cy="32" r="30" fill="url(#ring)" />
  <!-- Градиентный диск. -->
  <circle cx="32" cy="32" r="26" fill="url(#bg)" />
  <!-- Моноглиф «AC» (AI Career) — лаймовый, medium-weight, отрицательный трекинг. -->
  <text
    x="32"
    y="40"
    font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif"
    font-size="22"
    font-weight="600"
    text-anchor="middle"
    fill="#CFFF71"
    letter-spacing="-1.5"
  >AC</text>
</svg>
