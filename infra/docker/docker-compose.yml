services:
  api:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: career-copilot-api
    env_file:
      - ../../.env
    environment:
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: 7000
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MINIO_ENDPOINT: minio:9000
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-career_user}:${POSTGRES_PASSWORD:-career_pass}@postgres:5432/${POSTGRES_DB:-career_copilot}
      SYNC_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-career_user}:${POSTGRES_PASSWORD:-career_pass}@postgres:5432/${POSTGRES_DB:-career_copilot}
      MINIO_SECURE: "false"
    volumes:
      - ../../app:/app/app
      - ../../alembic:/app/alembic
      - ../../alembic.ini:/app/alembic.ini
    # entrypoint гонит миграции (wait postgres → alembic upgrade head → exec),
    # поэтому `docker compose up` сразу даёт рабочий стенд без ручного шага.
    entrypoint: ["/app/infra/docker/api-entrypoint.sh"]
    command: uvicorn app.main:app --host 0.0.0.0 --port 7000 --reload
    ports:
      - "${BACKEND_PORT:-7000}:7000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:7000/health', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
    dns:
      - 8.8.8.8
      - 1.1.1.1

  celery-worker:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: career-copilot-celery-worker
    env_file:
      - ../../.env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-career_user}:${POSTGRES_PASSWORD:-career_pass}@postgres:5432/${POSTGRES_DB:-career_copilot}
    volumes:
      - ../../app:/app/app
    command: celery -A app.celery_app:celery_app worker -l info -Q celery,vacancy,resume,cover_letter,interview,pipeline -c 4
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy

  celery-beat:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: career-copilot-celery-beat
    env_file:
      - ../../.env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-career_user}:${POSTGRES_PASSWORD:-career_pass}@postgres:5432/${POSTGRES_DB:-career_copilot}
    volumes:
      - ../../app:/app/app
    command: celery -A app.celery_app:celery_app beat -l info
    depends_on:
      redis:
        condition: service_started
      api:
        condition: service_healthy

  postgres:
    image: pgvector/pgvector:pg16
    container_name: career-copilot-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-career_copilot}
      POSTGRES_USER: ${POSTGRES_USER:-career_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-career_pass}
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-career_user} -d ${POSTGRES_DB:-career_copilot}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: career-copilot-redis
    ports:
      - "${REDIS_PORT:-6380}:6379"

  minio:
    image: minio/minio:latest
    container_name: career-copilot-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "9002:9000"
      - "9003:9001"
    volumes:
      - minio_data:/data

  prometheus:
    image: prom/prometheus:latest
    container_name: career-copilot-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus

  grafana:
    image: grafana/grafana:latest
    container_name: career-copilot-grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana

volumes:
  postgres_data:
  minio_data:
  prometheus_data:
  grafana_data:
